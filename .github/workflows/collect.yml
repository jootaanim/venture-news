name: collect-and-deploy
on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각은 혼잡해서 피함)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", "site/template.html", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 수집기 하나가 실패해도 나머지 수집과 배포는 계속한다(이전 데이터는 data/에 남아 있다).
      - run: python scripts/collect_kvic.py
        continue-on-error: true
      - run: python scripts/collect_kgrowth.py
        continue-on-error: true
      - run: python scripts/collect_kif.py
        continue-on-error: true
      # 수출입은행은 서버 인증서 체인 문제로 GitHub 서버에서는 연결이 안 될 수 있다.
      - run: python scripts/collect_koreaexim.py
        continue-on-error: true
      - run: python scripts/collect_kdb.py
        continue-on-error: true
      # 연기금·공제회: 미국 서버에서 접속되는지는 첫 실행 후 확인한다(실패해도 배포는 계속).
      - run: python scripts/collect_ktcu.py
        continue-on-error: true
      - run: python scripts/collect_mmaa.py
        continue-on-error: true
      - run: python scripts/collect_nps.py
        continue-on-error: true
      # 금융그룹 계열 운용사·VC의 출자사업 공고(신한벤처투자는 certs/ 의 공식 중간 인증서로 검증).
      - run: python scripts/collect_shinhanam.py
        continue-on-error: true
      - run: python scripts/collect_shinhanvc.py
        continue-on-error: true
      - run: python scripts/collect_wooriam.py
        continue-on-error: true
      - run: python scripts/collect_kiwoom.py
        continue-on-error: true
      - run: python scripts/collect_news.py
        continue-on-error: true
      # 새 공고문 PDF에서 접수마감·심사·선정발표 일정을 추출한다(한국성장금융은 요청 간격 60초라 새 공고가 많으면 오래 걸린다).
      - run: python scripts/extract_dates.py --limit 15
        continue-on-error: true
      - run: python scripts/build_site.py
      - name: 변경된 데이터 커밋
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: 출자사업 공지 갱신"
          git push
      - name: 배포용 폴더 정리
        run: |
          mkdir public
          cp site/index.html public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
