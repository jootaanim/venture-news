<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모험자본 출자사업 모니터</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--brand:#1f4e9c;
--k1:#1f4e9c;--k2:#2a7d4f;--k3:#b4541a;--k4:#7a3f9d;--k5:#6b7685}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e8ecf1;--mute:#93a0b1;--line:#2a323d;--brand:#6ea0f0;--k1:#6ea0f0;--k2:#5fc08a;--k3:#e8955a;--k4:#c08be0;--k5:#93a0b1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1{font-size:18px;margin:0}
.meta{font-size:12px;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.bar input{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
button.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
button.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:14px;margin:0;color:var(--mute);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.head button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{min-height:62px;border:1px solid var(--line);border-radius:6px;padding:3px;font-size:12px;cursor:default}
.day.has{cursor:pointer}
.day.sel{outline:2px solid var(--brand)}
.day.out{border-color:transparent}
.dot{display:block;margin-top:2px;padding:0 4px;border-radius:3px;color:#fff;font-size:11px}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}.k5{background:var(--k5)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{padding:9px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-right:4px}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.more{width:100%;margin-top:8px;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
footer{padding:24px 0;color:var(--mute);font-size:12px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap"><h1>모험자본 출자사업 모니터 <span class="meta" id="info"></span></h1></div></header>
<div class="wrap">
  <div class="bar"><input id="q" type="search" placeholder="제목 검색 (예: 모태펀드, 성장펀드)"><span id="srcs"></span><span id="chips"></span></div>
  <div class="grid">
    <section class="card">
      <div class="head"><button id="prev">&lt;</button><h2 id="month"></h2><button id="next">&gt;</button></div>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
      <p class="meta" style="margin:8px 0 0">달력은 공지 <b>게시일</b> 기준입니다. 접수 마감·심사일 등 실제 일정은 아직 반영되지 않았습니다.</p>
    </section>
    <section class="card">
      <div class="head"><h2 id="lh">공지 목록</h2><button id="clear" style="display:none">날짜 해제</button></div>
      <ul class="list" id="list"></ul>
      <button class="more" id="more" style="display:none">더 보기</button>
    </section>
  </div>
  <footer>출처: 한국벤처투자 출자사업공지(최근 2년), 한국성장금융 출자사업공고(최근 6개월). 제목과 원문 링크만 제공합니다. 정확한 내용은 원문을 확인하세요.</footer>
</div>

<script>
const D=window.DATA||[];
const CATS=["출자계획","선정결과","접수현황","서류결과","질의응답","기타"];
const SRCS=["전체",...new Set(D.map(d=>d.src))];let src="전체";
const KC={"출자계획":"k1","선정결과":"k2","접수현황":"k3","서류결과":"k4"};
const kc=c=>KC[c]||"k5";
let cat="전체",q="",selDay=null,limit=40;
const latest=D.length?D[0].date:new Date().toISOString().slice(0,10);
let ym=latest.slice(0,7);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=d=>(cat==="전체"||d.cat===cat)&&(src==="전체"||d.src===src)&&(!q||d.title.toLowerCase().includes(q));
function filtered(){return D.filter(d=>ok(d)&&(!selDay||d.date===selDay))}
function chips(){
 $("srcs").innerHTML=SRCS.map(s=>`<button class="chip ${s===src?"on":""}" data-s="${s}">${s==="전체"?"전체 기관":s}</button>`).join(" ");
 $("srcs").querySelectorAll("button").forEach(b=>b.onclick=()=>{src=b.dataset.s;selDay=null;limit=40;render()});$("chips").innerHTML=["전체",...CATS].map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join(" ");
 $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;selDay=null;limit=40;render()});
 $("legend").innerHTML=CATS.slice(0,4).map(c=>`<span><i class="${kc(c)}"></i>${c}</span>`).join("")}
function cal(){
 const [y,m]=ym.split("-").map(Number);$("month").textContent=`${y}년 ${m}월`;
 const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
 const by={};D.filter(d=>d.date.startsWith(ym)&&ok(d)).forEach(d=>{(by[d.date]=by[d.date]||[]).push(d)});
 let h=["일","월","화","수","목","금","토"].map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<first;i++)h+=`<div class="day out"></div>`;
 for(let d=1;d<=days;d++){const key=`${ym}-${String(d).padStart(2,"0")}`;const ev=by[key]||[];
  const counts={};ev.forEach(e=>counts[e.cat]=(counts[e.cat]||0)+1);
  h+=`<div class="day ${ev.length?"has":""} ${key===selDay?"sel":""}" data-d="${key}"><b>${d}</b>${Object.entries(counts).map(([c,n])=>`<span class="dot ${kc(c)}">${c} ${n}</span>`).join("")}</div>`}
 $("cal").innerHTML=h;
 $("cal").querySelectorAll(".day.has").forEach(e=>e.onclick=()=>{selDay=selDay===e.dataset.d?null:e.dataset.d;limit=40;render()})}
function list(){const f=filtered();
 $("lh").textContent=selDay?`${selDay} 공지 (${f.length}건)`:`공지 목록 (${f.length}건)`;
 $("clear").style.display=selDay?"":"none";
 $("list").innerHTML=f.slice(0,limit).map(d=>`<li><span class="tag">${esc(d.cat)}</span><span class="tag">${esc(d.src)}</span><span class="meta">${d.date}${d.files?` · 첨부 ${d.files}`:""}</span><div><a href="${d.url}" target="_blank" rel="noopener">${esc(d.title)}</a></div></li>`).join("")||`<li class="meta">조건에 맞는 공지가 없습니다.</li>`;
 $("more").style.display=f.length>limit?"":"none"}
function render(){chips();cal();list()}
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();selDay=null;limit=40;render()};
$("more").onclick=()=>{limit+=40;list()};
$("clear").onclick=()=>{selDay=null;render()};
function shift(n){const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;selDay=null;render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("info").textContent=D.length?`· 총 ${D.length}건 · 최신 공지 ${latest}`:"· 데이터 없음";
render();
</script>
